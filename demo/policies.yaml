# Fictional special conditions (bijzondere voorwaarden), amendments (aanhangsels) and insurance
# certificates of the demo clients. Special conditions hold personal data, so no real ones are
# public; these are made up and rendered as PDFs by backend/demo_policies.py on ingest.
# Emails in demo/mailbox/*.yaml attach them by key, like the general conditions in documents.yaml.
#
# Fields: insurer (axa | ag | pv), product, policy, doc (document title), issued, reason, effective,
# holder, sections (title -> label -> value), guarantees ([name, limit, deductible, premium incl.
# taxes, tax kind]; tax kind: ba_auto | woning | standard (default)), payment, clauses, text,
# conditions (names of the general conditions that apply).
#
# Facts here match the emails (cars, addresses, deductibles, premiums). All of it is invented.

# --- reusable blocks -----------------------------------------------------------------------------

