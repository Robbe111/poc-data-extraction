  body: |
    Dag Karim,

    Bedankt voor het gesprek van gisteren. Je brandverzekering is in orde vanaf 1 maart. Ik heb gekozen voor AG Insurance, omdat hun Top Woning werkt als een "alles behalve"-polis: alles is gedekt, behalve wat uitdrukkelijk uitgesloten is. Voor jouw computer- en fotomateriaal is dat interessant.

    Je polis Top Woning 08.3.561.447 (bijzondere voorwaarden en algemene voorwaarden in bijlage):
    - Huurdersaansprakelijkheid: 132,50 EUR
    - Inhoud 20.000 EUR: 64,30 EUR
    - Pack Huurder (rechtsbijstand bij een geschil met je verhuurder, tijdelijke huisvesting en bijstand thuis): 38,90 EUR
    Totaal 235,70 EUR per jaar, alle taksen inbegrepen.

    AG ziet af van verhaal tegen je verhuurder. Je kan de bijzondere voorwaarden als bewijs aan je verhuurder bezorgen. Voor je familiale stuur ik je begin volgende week een voorstel.

    Groetjes,

    Els Hoflandt
