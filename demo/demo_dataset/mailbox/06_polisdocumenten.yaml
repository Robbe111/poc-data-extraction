# Policy documents sent to clients: renewals at the annual due date (vervaldag), amendments
# (aanhangsels), new contracts and copies on request. Each broker email attaches the client's
# special conditions (demo/policies.yaml, generated) and, for new contracts, the general
# conditions (demo/documents.yaml). Dates are Brussels local time.

