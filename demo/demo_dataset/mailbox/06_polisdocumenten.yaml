  attachments: [bv_vanhoof_prive_2025]
  body: |
    Dag meneer Van Hoof,

    Op 1 november vervalt uw familiale verzekering, AXA Comfort Privéleven 62.377.842. In bijlage vindt u de nieuwe bijzondere voorwaarden. De premie wordt enkel aangepast aan het indexcijfer: 131,80 EUR per jaar, alle taksen inbegrepen. U hoeft niets te doen, de premie wordt zoals altijd via domiciliëring betaald.

    Goed om te weten nu Arne in Gent op kot zit: zolang hij bij u gedomicilieerd blijft, is hij mee verzekerd. Uw polis dekt ook schade aan zijn studentenkamer tot 50.000 EUR (waarborg "Tijdelijk verblijf").

    Met vriendelijke groeten,

    Els Hoflandt
