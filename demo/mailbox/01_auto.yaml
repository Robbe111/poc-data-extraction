# Car insurance (AXA Comfort Auto): claims and questions. Dates are Brussels local time.

# --- Jan Peeters: steenslag, barst in voorruit (glasbreuk + vervangwagen) -------------------
- id: hoflandt.voorruit-peeters.1
  date: 2026-07-08 08:47
  from: jan.peeters@telenet.be
  to: info@hoflandt.be
  subject: Barst in voorruit na steenslag
  body: |
    Goeiemorgen,

    Gisteren op de E313 ter hoogte van Herentals kreeg ik een steen tegen mijn voorruit. Er zat eerst een klein sterretje in, maar vanochtend is dat een barst van zo'n 20 cm geworden, recht in mijn zichtveld. Het gaat over de VW Golf (1-XKT-482).

    Is dit gedekt door mijn autoverzekering? En mag ik zelf een ruitenhersteller kiezen of moet dat via jullie? Ik heb de auto elke dag nodig voor het werk, dus als ik een vervangwagen kan krijgen tijdens de herstelling zou dat handig zijn.

    Groeten,
    Jan Peeters

- id: hoflandt.voorruit-peeters.2
  date: 2026-07-08 10:15
  from: pieter.janssens@hoflandt.be
  to: jan.peeters@telenet.be
  subject: "RE: Barst in voorruit na steenslag"
  attachments: [axa_omnium, axa_vervangwagen]
  body: |
    Dag meneer Peeters,

    Goed nieuws: u heeft bij AXA een Comfort Auto met de formule Mini Omnium Extra, en daarin zit de dekking Glasbreuk. Volgens artikel 1.4.2 van de algemene voorwaarden "Bescherming van het voertuig" dekt AXA het breken of barsten van de voor-, zij- en achterruiten. Enige voorwaarde: u moet de ruit effectief laten herstellen of vervangen, anders is er geen tussenkomst. Uw bijzondere voorwaarden vermelden geen vrijstelling op glasbreuk.

    U mag zelf een hersteller kiezen. Bezorg ons na de herstelling de factuur en een foto van de beschadigde ruit, dan doen wij de aangifte. De aangifte moet binnen 8 dagen gebeuren (artikel 2.5.1), maar dat regelen wij voor u.

    Vervangwagen: u heeft ook de waarborg Vervangingsvoertuig afgesloten. Voor glasbreuk voorziet die een vervangwagen voor de duur van de herstelling, met een maximum van 3 dagen. Bel daarvoor het nummer van de AXA-bijstandsdienst op uw verzekeringsbewijs vóór u de wagen binnenbrengt, anders is de tussenkomst beperkt.

    Beide algemene voorwaarden zitten in bijlage.

    Met vriendelijke groeten,

    Pieter Janssens
    Schadebeheer - Verzekeringskantoor Hoflandt

- id: hoflandt.voorruit-peeters.3
  date: 2026-07-09 19:32
  from: jan.peeters@telenet.be
  to: pieter.janssens@hoflandt.be
  subject: "RE: Barst in voorruit na steenslag"
  body: |
    Bedankt Pieter, heel duidelijk.

    De ruit wordt vrijdag vervangen bij mijn vaste garage in Nijlen. Zij zeggen dat de camera van de rijhulpsystemen achter de voorruit daarna opnieuw gekalibreerd moet worden, dat kost blijkbaar nog eens 280 euro. Wordt dat ook terugbetaald of is dat voor mij?

    Jan

- id: hoflandt.voorruit-peeters.4
  date: 2026-07-10 09:05
  from: pieter.janssens@hoflandt.be
  to: jan.peeters@telenet.be
  subject: "RE: Barst in voorruit na steenslag"
  body: |
    Dag Jan,

    De kalibratie van de camera is een noodzakelijk onderdeel van de vervanging van de voorruit, dus die hoort bij de herstellingskosten en wordt mee vergoed. Vraag de garage wel om de kalibratie apart op dezelfde factuur te vermelden.

    Stuur ons de factuur na vrijdag door, dan dienen we alles in één keer in bij AXA. Ons dossiernummer is S-2026-0418.

    Groeten,
    Pieter

# --- Sarah De Smet: ree aangereden in de Ardennen (botsing met dieren) ----------------------
- id: hoflandt.ree-desmet.1
  date: 2026-08-17 07:58
  from: sarah.desmet@gmail.com
  to: schade@hoflandt.be
  subject: Ree aangereden - wat moet ik doen?
  body: |
    Hallo,

    Gisteravond rond 22u ben ik tussen Durbuy en Hotton tegen een ree gereden. Alles is in orde met mij, maar de voorbumper en de linkerkoplamp van mijn Toyota Yaris zijn kapot en er lekt iets onder de motor, waarschijnlijk de radiator. Ik ben voorzichtig tot aan onze vakantiewoning gereden maar durf er niet meer mee naar huis.

    Ik heb foto's genomen van de auto en van de plek. Wat moet ik nu doen? Is dit verzekerd?

    Sarah De Smet

- id: hoflandt.ree-desmet.2
  date: 2026-08-17 09:21
  from: pieter.janssens@hoflandt.be
  to: sarah.desmet@gmail.com
  subject: "RE: Ree aangereden - wat moet ik doen?"
  attachments: [axa_omnium]
  body: |
    Dag mevrouw De Smet,

    Fijn dat u zelf ongedeerd bent. Uw Comfort Auto bij AXA heeft de formule Omnium, en daarin is "Botsing met dieren" gedekt: schade door dieren die tegen de buitenkant van het voertuig botsen (artikel 1.4.4 van de bijgevoegde algemene voorwaarden "Bescherming van het voertuig").

    Wat u best doet:
    1. Laat de wagen niet meer rijden als de radiator lekt. De noodzakelijke sleping is gedekt tot 1.240 EUR excl. btw (artikel 1.5.4). U mag de wagen naar een garage van uw keuze laten brengen.
    2. Vraag bij de lokale politie een attest of vaststelling van de aanrijding met wild. Dat is niet verplicht volgens de voorwaarden, maar het maakt het dossier veel sterker.
    3. Stuur ons de foto's en het adres van de garage. Wij doen de aangifte (die moet binnen 8 dagen gebeuren, artikel 2.5.1).

    AXA stelt daarna een expert aan die de schade raamt. Van de vergoeding gaat de vrijstelling uit uw bijzondere voorwaarden af, bij u 400 EUR.

    Goed om te weten: een botsing met een dier valt niet onder "Materiële schade (ongeval)" en telt dus niet mee voor de aanpassing van uw premie.

    Met vriendelijke groeten,

    Pieter Janssens
    Schadebeheer - Verzekeringskantoor Hoflandt

- id: hoflandt.ree-desmet.3
  date: 2026-08-19 14:40
  from: sarah.desmet@gmail.com
  to: pieter.janssens@hoflandt.be
  subject: "RE: Ree aangereden - wat moet ik doen?"
  body: |
    Dag Pieter,

    De politie van de zone Aisne heeft een vaststelling gedaan, het PV-nummer is MA.55.L7.004812/2026. De auto is gisteren met een takeldienst naar Garage Van Loock in Lier gebracht, de takelfactuur is 465 euro.

    De foto's stuur ik via WeTransfer, die zijn te groot voor een mail.

    Groetjes,
    Sarah

- id: hoflandt.ree-desmet.4
  date: 2026-08-28 11:12
  from: pieter.janssens@hoflandt.be
  to: sarah.desmet@gmail.com
  subject: "RE: Ree aangereden - wat moet ik doen? (dossier S-2026-0503)"
  body: |
    Dag Sarah,

    De expert van AXA is dinsdag langs geweest bij de garage. Hij raamt de schade op 3.870 EUR incl. btw en de wagen is herstelbaar. Omdat u als particulier de btw niet kan recupereren, wordt die mee vergoed.

    Afrekening:
    - herstelling: 3.870 EUR
    - takelkosten: 465 EUR (binnen het maximum van 1.240 EUR)
    - vrijstelling: -400 EUR
    Totaal door AXA te betalen: 3.935 EUR

    De garage mag starten met de herstelling. AXA betaalt de herstelling rechtstreeks aan de garage; de takelkosten min de vrijstelling worden op uw rekening gestort.

    Groeten,
    Pieter

# --- Tom Willems: turbo kapot, pech op de E19 (mechanisch defect is geen omnium) ---------------
- id: hoflandt.turbo-willems.1
  date: 2026-09-02 17:26
  from: tom.willems@skynet.be
  to: info@hoflandt.be
  subject: Auto stilgevallen - turbo kapot, is dit gedekt?
  body: |
    Goeiedag,

    Vanmiddag is mijn Peugeot 3008 (2019) stilgevallen op de E19 bij Kontich. Er kwam witte rook uit de uitlaat en de motor viel in noodmodus. De politie was er snel bij en heeft een takeldienst laten komen. De garage zegt nu dat de turbo kapot is en dat het ongeveer 2.900 euro gaat kosten.

    Ik heb toch een omnium bij jullie? Valt dit daaronder? En krijg ik ondertussen een vervangwagen?

    Tom Willems

- id: hoflandt.turbo-willems.2
  date: 2026-09-03 08:52
  from: pieter.janssens@hoflandt.be
  to: tom.willems@skynet.be
  subject: "RE: Auto stilgevallen - turbo kapot, is dit gedekt?"
  attachments: [axa_omnium, axa_wegenhulp]
  body: |
    Dag meneer Willems,

    Vervelend, dat is een dure panne. Ik moet u helaas teleurstellen voor de herstelling zelf.

    Uw Comfort Auto heeft de formule Mini Omnium: die dekt brand, glasbreuk, botsing met dieren, natuurkrachten en diefstal, maar geen materiële schade aan de wagen zelf. En zelfs met een volledige omnium zou een kapotte turbo niet gedekt zijn: artikel 1.4.6 van "Bescherming van het voertuig" sluit schade uit door slijtage, een fout in de constructie of montage, een gebrek in het materiaal of slecht onderhoud. Een mechanisch defect is dus geen verzekerd schadegeval. Uw wagen is 7 jaar oud; vraag de merkgarage eventueel naar een commerciële tussenkomst.

    Wat wel gedekt is, is de pechhulp via uw waarborg Wegenhulp (voorwaarden in bijlage):
    - Sleping: normaal organiseert de AXA-bijstandsdienst het slepen naar een garage van uw keuze. Werd de sleping uitgevoerd door een erkende takelaar in opdracht van de politie, dan is de tussenkomst beperkt tot 500 EUR (artikel 2.2.1).
    - Vervangwagen: bij pech in België heeft u recht op een vervangwagen categorie B voor de duur van de herstelling, maximum 7 dagen (15 dagen in een geconventioneerde garage), artikel 2.2.3.

    Kan u mij de takelfactuur bezorgen?

    Met vriendelijke groeten,

    Pieter Janssens
    Schadebeheer - Verzekeringskantoor Hoflandt

- id: hoflandt.turbo-willems.3
  date: 2026-09-03 12:14
  from: tom.willems@skynet.be
  to: pieter.janssens@hoflandt.be
  subject: "RE: Auto stilgevallen - turbo kapot, is dit gedekt?"
  body: |
    Dag Pieter,

    Jammer van de turbo, maar bedankt voor de uitleg. De takelfactuur is 385 euro, van een takeldienst die door de snelwegpolitie was opgeroepen. Ik heb de bijstandsdienst van AXA zelf niet gebeld, dat wist ik niet.

    Kan ik nu nog een vervangwagen vragen? De herstelling duurt minstens een week want de turbo moet besteld worden.

    Tom

- id: hoflandt.turbo-willems.4
  date: 2026-09-03 15:47
  from: pieter.janssens@hoflandt.be
  to: tom.willems@skynet.be
  subject: "RE: Auto stilgevallen - turbo kapot, is dit gedekt?"
  body: |
    Dag Tom,

    De takelfactuur van 385 EUR valt binnen het maximum van 500 EUR voor een sleping in opdracht van de politie, die wordt dus volledig terugbetaald. Ik heb ze vandaag bij AXA ingediend.

    Voor de vervangwagen ligt het moeilijker: volgens artikel 2.2.3.2 van de voorwaarden Wegenhulp is de vervangwagen niet verschuldigd als AXA de sleping niet zelf georganiseerd heeft of er vooraf niet mee ingestemd heeft. Ik heb toch gevraagd of AXA een uitzondering wil maken omdat de politie de takeling regelde, maar reken er best niet op. Ik laat u iets weten zodra ik antwoord heb.

    Voor een volgende keer: bel bij pech altijd eerst het bijstandsnummer op uw verzekeringsbewijs, ook als de politie er al is.

    Groeten,
    Pieter

# --- Lotte Claes: nieuw contract (EV) en daarna parkeerschade door onbekende ------------------
- id: hoflandt.contract-claes.1
  date: 2026-06-22 16:05
  from: els@hoflandt.be
  to: lotte.claes@hotmail.com
  subject: Uw nieuwe autoverzekering AXA Comfort Auto - polis 43.131.822
  attachments: [axa_auto_ipid, axa_auto_algemeen, axa_ba_auto, axa_omnium]
  body: |
    Beste Lotte,

    Proficiat met je nieuwe Kia EV6! Je autoverzekering bij AXA is in orde vanaf 1 juli 2026, polisnummer 43.131.822. Je ontvangt de bijzondere voorwaarden en het verzekeringsbewijs nog per post.

    Samengevat heb je:
    - Aansprakelijkheid (verplicht), incl. BOB-garantie
    - Bescherming van het voertuig, formule Omnium: brand, glasbreuk, natuurkrachten, botsing met dieren, diefstal en materiële schade
    - Verzekerde waarde: factuurwaarde 48.950 EUR, vrijstelling materiële schade 500 EUR

    Omdat het een elektrische wagen is: je laadkabel is mee verzekerd tot 500 EUR excl. btw, ook al is die losgemaakt van de wagen (artikel 1.6.1 van "Bescherming van het voertuig").

    In bijlage vind je het informatiedocument (IPID) en de algemene voorwaarden: de algemene bepalingen, Aansprakelijkheid en Bescherming van het voertuig. Bewaar ze goed.

    Vriendelijke groeten,

    Els Hoflandt
    Verzekeringskantoor Hoflandt

- id: hoflandt.parkeerschade-claes.1
  date: 2026-08-05 13:02
  from: lotte.claes@hotmail.com
  to: schade@hoflandt.be
  subject: Iemand is tegen mijn geparkeerde auto gereden en doorgereden
  body: |
    Hallo,

    Ik stond geparkeerd op de parking van de supermarkt in Duffel en toen ik terugkwam zat er een flinke deuk met krassen in het achterste portier rechts. Geen briefje, niemand gezien. Echt balen want de auto is net een maand oud.

    Kan ik dit via mijn omnium laten herstellen? En stijgt mijn premie dan, want ik heb niets fout gedaan?

    Lotte

- id: hoflandt.parkeerschade-claes.2
  date: 2026-08-05 15:30
  from: pieter.janssens@hoflandt.be
  to: lotte.claes@hotmail.com
  subject: "RE: Iemand is tegen mijn geparkeerde auto gereden en doorgereden"
  attachments: [axa_auto_algemeen]
  body: |
    Dag Lotte,

    Ja, dat kan. Je hebt een volledige Omnium, en de dekking "Materiële schade (ongeval)" vergoedt ook schade door een onbekende derde. De vrijstelling van 500 EUR blijft wel van toepassing.

    Over je premie: die wordt enkel aangepast na een "schadegeval in fout". Voor materiële schade moet het gaan om een ongeval waarvoor de verzekerde geheel of gedeeltelijk in fout was (artikel 2.1.2.2 van de algemene bepalingen, in bijlage). Je stond geparkeerd, dus je bent niet in fout en dit telt niet mee.

    Doe wel zo snel mogelijk aangifte bij de politie van het vluchtmisdrijf en vraag de supermarkt of ze camerabeelden hebben. Als de dader gevonden wordt, recupereert AXA de schade bij zijn verzekeraar en krijg je ook je vrijstelling terug.

    Stuur me het PV-nummer en een offerte van de carrosserie.

    Groeten,
    Pieter Janssens
    Schadebeheer - Verzekeringskantoor Hoflandt

- id: hoflandt.parkeerschade-claes.3
  date: 2026-08-06 18:44
  from: lotte.claes@hotmail.com
  to: pieter.janssens@hoflandt.be
  subject: "RE: Iemand is tegen mijn geparkeerde auto gereden en doorgereden"
  body: |
    Dag Pieter,

    PV is opgemaakt bij de politie Rupel-Duffel (nummer ME.43.L2.019377/2026). Geen camerabeelden helaas, die camera hangt enkel aan de ingang. De offerte van de carrosserie is 1.340 euro. Heeft het zin om dat in te dienen met 500 euro vrijstelling?

    Lotte

- id: hoflandt.parkeerschade-claes.4
  date: 2026-08-07 09:10
  from: pieter.janssens@hoflandt.be
  to: lotte.claes@hotmail.com
  subject: "RE: Iemand is tegen mijn geparkeerde auto gereden en doorgereden"
  body: |
    Dag Lotte,

    Zeker de moeite: je krijgt 840 EUR (1.340 EUR min 500 EUR vrijstelling) en er is geen gevolg voor je premie. Ik heb de aangifte vandaag ingediend, dossiernummer S-2026-0487. Bij een schade onder 1.500 EUR stuurt AXA meestal geen expert; de carrosserie mag starten zodra AXA akkoord geeft, normaal binnen een paar werkdagen.

    Groeten,
    Pieter

# --- Kevin Maes: kop-staartaanrijding in fout, enkel BA (premie en terugbetalen) ------------
- id: hoflandt.aanrijding-maes.1
  date: 2026-07-21 18:20
  from: kevin.maes@telenet.be
  to: schade@hoflandt.be
  subject: Ongeval op de Ring, ik ben in fout
  body: |
    Dag,

    Vanmiddag ben ik in de file op de Ring bij Antwerpen achteraan ingereden op een Audi. Het ging traag, maar toch: zijn bumper en trekhaak zijn beschadigd en mijn motorkap en koplamp ook. We hebben samen een aanrijdingsformulier ingevuld en daarop staat dat ik in fout ben.

    Wat wordt er nu betaald? En wat met mijn premie? Ik rij al 12 jaar zonder ongeval.

    Kevin Maes

- id: hoflandt.aanrijding-maes.2
  date: 2026-07-22 09:35
  from: pieter.janssens@hoflandt.be
  to: kevin.maes@telenet.be
  subject: "RE: Ongeval op de Ring, ik ben in fout"
  attachments: [axa_ba_auto, axa_auto_algemeen]
  body: |
    Dag meneer Maes,

    Stuurt u mij het aanrijdingsformulier (scan of foto van beide zijden)? De aangifte moet binnen 8 dagen gebeuren.

    Wat is gedekt: u heeft voor uw Opel Astra enkel de verplichte Aansprakelijkheid. Die vergoedt de schade van de tegenpartij: de herstelling van de Audi en eventuele letsels. De schade aan uw eigen wagen is niet verzekerd, daarvoor zou u een omnium nodig hebben.

    Wat met uw premie: de algemene bepalingen (artikel 2.1.2) personaliseren de premie volgens het aantal schadevrije jaren en het aantal schadegevallen in fout in de laatste 5 jaar. Na een observatieperiode met een schadegeval in fout valt het aantal schadevrije jaren terug naar 0, wat een premieniveau van 130% geeft. Eén schadegeval in 5 jaar geeft 100% op de tweede schaal. Uw volgende premie wordt dus basispremie x 130% x 100%, en daarna zakt ze elk schadevrij jaar weer (125%, 120%, ...).

    Uw jaarlijkse vervaldag is 1 oktober. De observatieperiode sluit op 15 augustus, dus dit ongeval telt al mee voor de premie van oktober.

    Beide algemene voorwaarden zitten in bijlage.

    Met vriendelijke groeten,

    Pieter Janssens
    Schadebeheer - Verzekeringskantoor Hoflandt

- id: hoflandt.aanrijding-maes.3
  date: 2026-07-22 12:48
  from: kevin.maes@telenet.be
  to: pieter.janssens@hoflandt.be
  subject: "RE: Ongeval op de Ring, ik ben in fout"
  body: |
    Hallo Pieter,

    In bijlage het aanrijdingsformulier (ik stuur het ook per post). Dat is wel een zware premieverhoging voor een bumper. Kan ik de schade van de Audi niet gewoon zelf betalen, zodat het niet als schadegeval telt? De bestuurder zei dat het waarschijnlijk rond de 1.500 euro zal liggen.

    Kevin

- id: hoflandt.aanrijding-maes.4
  date: 2026-07-22 16:03
  from: pieter.janssens@hoflandt.be
  to: kevin.maes@telenet.be
  subject: "RE: Ongeval op de Ring, ik ben in fout"
  body: |
    Dag Kevin,

    Dat kan, en in uw geval is het waarschijnlijk interessant. Voor de premie Aansprakelijkheid telt een schadegeval pas als "in fout" wanneer AXA een vergoeding aan de benadeelde betaald heeft (artikel 2.1.2.2 van de algemene bepalingen). Betaalt u zelf, dan is er geen premie-impact.

    Mijn advies: laat AXA het dossier gewoon behandelen, maar zet het in afwachting. Zodra het definitieve bedrag gekend is, reken ik voor u uit wat de premieverhoging over de komende jaren kost. Is dat meer dan de schade, dan kan u AXA het bedrag terugbetalen en wordt het schadegeval niet meegeteld. Zo houdt u de bescherming voor het geval de schade hoger uitvalt dan verwacht, bijvoorbeeld als de bestuurder later nog nekklachten meldt.

    Groeten,
    Pieter

# --- An Vermeulen: zoon met voorlopig rijbewijs (verhaalsrecht) ------------------------------
- id: hoflandt.jonge-bestuurder-vermeulen.1
  date: 2026-07-02 20:11
  from: an.vermeulen@proximus.be
  to: els@hoflandt.be
  subject: Mag onze zoon met mijn auto rijden?
  body: |
    Dag Els,

    Onze zoon Wout is net 18 en heeft zijn theorie-examen gehaald. Hij heeft nu een voorlopig rijbewijs van 18 maanden, zonder begeleider. Mag hij daarmee met mijn auto rijden, en is hij dan verzekerd? Moet ik dat ergens melden?

    Alvast bedankt,
    An

- id: hoflandt.jonge-bestuurder-vermeulen.2
  date: 2026-07-03 10:27
  from: els@hoflandt.be
  to: an.vermeulen@proximus.be
  subject: "RE: Mag onze zoon met mijn auto rijden?"
  attachments: [axa_ba_auto]
  body: |
    Dag An,

    Proficiat aan Wout! Kort antwoord: ja, hij mag met je auto rijden en de schade aan anderen is gedekt door je Aansprakelijkheid. Maar let op de voorwaarden van zijn rijbewijs.

    De Aansprakelijkheid vergoedt altijd de slachtoffers, ook als je zoon rijdt. AXA heeft wel een recht van verhaal (terugvordering) als de bestuurder geen geldig rijbewijs heeft voor dat voertuig of de beperkingen op zijn rijbewijs niet respecteert (zie de tabel in artikel 1.7.3 van de bijgevoegde voorwaarden "Aansprakelijkheid"). Met een voorlopig rijbewijs zonder begeleider gelden o.a. beperkingen voor 's nachts rijden in het weekend en op feestdagen, en voor het aantal passagiers. Als Wout zich daar niet aan houdt en een ongeval veroorzaakt, kan AXA een deel terugvorderen. Dat verhaal is wettelijk begrensd: 11.000 EUR, verhoogd met de helft van wat daarboven uitgegeven is, met een maximum van 31.000 EUR.

    Zolang Wout af en toe met jouw auto rijdt, is hij een occasionele bestuurder en moet je niets melden. Wordt hij de hoofdbestuurder of rijdt hij dagelijks met de auto, dan moet je dat melden (artikel 1.5.1).

    Groetjes,
    Els Hoflandt
    Verzekeringskantoor Hoflandt

- id: hoflandt.jonge-bestuurder-vermeulen.3
  date: 2026-07-03 21:40
  from: an.vermeulen@proximus.be
  to: els@hoflandt.be
  subject: "RE: Mag onze zoon met mijn auto rijden?"
  body: |
    Dag Els,

    Duidelijk, bedankt! Hij zal enkel af en toe in het weekend rijden. Ik heb hem jouw mail laten lezen, hij weet nu dat hij niet 's nachts mag rijden in het weekend 😉

    Vanaf september gaat hij wel op kot in Leuven en wil hij misschien een tweedehandsje kopen. Kan je ons dan een offerte maken voor een kleine auto op zijn naam?

    An

# --- Bart Wouters: BMW X1 gestolen (diefstal, verloren sleutel, totaal verlies) --------------
- id: hoflandt.diefstal-wouters.1
  date: 2026-08-10 07:12
  from: bart.wouters@gmail.com
  to: [schade@hoflandt.be, pieter.janssens@hoflandt.be]
  subject: DRINGEND - auto gestolen vannacht
  body: |
    Pieter,

    Mijn BMW X1 is vannacht gestolen van voor mijn deur in Mortsel. Hij stond op slot op de oprit, de sleutel ligt binnen op de kast. Mijn buurman heeft rond 3u 's nachts een auto horen vertrekken.

    Wat moet ik allemaal doen? Ik moet vandaag naar een klant in Gent en heb geen auto.

    Bart Wouters

- id: hoflandt.diefstal-wouters.2
  date: 2026-08-10 08:05
  from: pieter.janssens@hoflandt.be
  to: bart.wouters@gmail.com
  subject: "RE: DRINGEND - auto gestolen vannacht"
  attachments: [axa_omnium, axa_wegenhulp]
  body: |
    Dag Bart,

    Wat een vervelend begin van de week. Dit moet je vandaag doen:

    1. Onmiddellijk klacht indienen bij de lokale politie en mij het PV-nummer bezorgen (artikel 2.5.1 van "Bescherming van het voertuig").
    2. De aangifte bij AXA moet binnen 24 uur gebeuren bij diefstal. Dat doe ik vandaag zodra ik het PV-nummer heb.
    3. Hou alle sleutels, het inschrijvingsbewijs en het gelijkvormigheidsattest klaar: AXA vraagt die op.

    Dekking: je hebt een Omnium, diefstal van het voertuig is gedekt (artikel 1.4.5), op voorwaarde dat de wagen op slot was en de sleutels niet in of op de wagen lagen. Wordt de wagen niet teruggevonden binnen 30 dagen na de schriftelijke aangifte, dan wordt hij als totaal verlies vergoed volgens de afschrijvingsformule in je bijzondere voorwaarden (artikel 2.5.6).

    Vervangwagen: je hebt ook Wegenhulp. Bij diefstal in België heb je recht op een vervangwagen categorie B voor maximum 30 opeenvolgende dagen (artikel 2.2.3.2). Bel daarvoor nu meteen het bijstandsnummer op je verzekeringsbewijs (staat ook in de AXA-app), dan kan je vandaag nog rijden.

    Beide voorwaarden in bijlage.

    Pieter Janssens
    Schadebeheer - Verzekeringskantoor Hoflandt

- id: hoflandt.diefstal-wouters.3
  date: 2026-08-10 11:48
  from: bart.wouters@gmail.com
  to: pieter.janssens@hoflandt.be
  subject: "RE: DRINGEND - auto gestolen vannacht"
  body: |
    Pieter,

    PV-nummer: AN.44.L1.028841/2026 (politiezone Minos). Vervangwagen komt deze middag, top.

    Nog één ding dat ik moet melden: ik heb maar één sleutel meer. De tweede sleutel ben ik vorig jaar in de zomer kwijtgeraakt, waarschijnlijk op het strand. Ik heb toen niets laten aanpassen aan de wagen. Is dat een probleem? De politie denkt trouwens aan een "relay attack", de X1 heeft keyless entry.

    Bart

- id: hoflandt.diefstal-wouters.4
  date: 2026-08-10 12:20
  from: pieter.janssens@hoflandt.be
  to: els@hoflandt.be
  subject: "Dossier Bart Wouters - diefstal X1, sleutel verloren"
  body: |
    Els,

    Even overleg over het dossier van Bart Wouters (Omnium 43.089.633). Zijn X1 is vannacht gestolen, maar hij meldt nu dat hij vorig jaar een sleutel verloren heeft zonder de sloten te laten vervangen of de sleutels te laten herprogrammeren.

    Artikel 1.4.5 van de voorwaarden "Bescherming van het voertuig" sluit diefstal uit wanneer, na verlies of diefstal van de sleutels, niet binnen 24 uur de nodige stappen gezet zijn om de sloten te vervangen of het sleutelsysteem te herprogrammeren. AXA kan zich daarop beroepen.

    Pluspunt: de politie vermoedt een relay attack op het keyless systeem, dan speelt de verloren sleutel geen rol bij de diefstal zelf. Ik stel voor dat ik het verlies van de sleutel eerlijk meld in de aangifte, samen met de vaststellingen van de politie, en vraag dat de expert onderzoekt hoe de wagen gestart is. Akkoord?

    Pieter

- id: hoflandt.diefstal-wouters.5
  date: 2026-09-15 10:02
  from: pieter.janssens@hoflandt.be
  to: bart.wouters@gmail.com
  cc: els@hoflandt.be
  subject: "Diefstal BMW X1 - totaal verlies (dossier S-2026-0495)"
  body: |
    Dag Bart,

    Goed nieuws in je dossier. De wagen is na 30 dagen niet teruggevonden, dus AXA behandelt hem als totaal verlies. De expert besluit dat de diefstal via het keyless systeem gebeurde (relay attack), zonder gebruik van een fysieke sleutel. De verloren sleutel speelt dus geen rol en AXA past de uitsluiting niet toe.

    Vergoeding: verzekerde waarde volgens de afschrijvingsformule in je bijzondere voorwaarden (wagen van 38 maanden oud), plus de belasting op inverkeerstelling, min de vrijstelling. AXA komt uit op 31.450 EUR. Je ontvangt de kwijting deze week per mail; na ondertekening volgt de betaling binnen 30 dagen.

    Je vervangwagen is op 9 september teruggegaan (maximum 30 dagen bij diefstal). Zodra je een nieuwe wagen hebt, maken we een nieuwe offerte. Denk dan ook aan een beveiliging voor het keyless systeem.

    Groeten,
    Pieter

# --- Nathalie Dubois: hagelbui, schade aan auto en woning -------------------------------------
- id: hoflandt.hagel-dubois.1
  date: 2026-07-05 09:30
  from: nathalie.dubois@telenet.be
  to: info@hoflandt.be
  subject: Hagelschade auto en veranda
  body: |
    Goeiemorgen,

    Tijdens het onweer gisterenavond in Lier kwamen er hagelstenen zo groot als knikkers naar beneden. Mijn Renault Clio stond op de oprit en zit vol deukjes, op de motorkap en het dak. Het polycarbonaat dak van onze veranda is op drie plaatsen gebarsten en de dakgoot is ingedeukt. De tuinset (glazen tafel) is ook kapot.

    Hoe pak ik dit aan? Moet ik voor de auto en het huis aparte aangiftes doen?

    Nathalie Dubois

- id: hoflandt.hagel-dubois.2
  date: 2026-07-06 10:44
  from: pieter.janssens@hoflandt.be
  to: nathalie.dubois@telenet.be
  subject: "RE: Hagelschade auto en veranda"
  attachments: [axa_omnium, axa_woning_flex]
  body: |
    Dag mevrouw Dubois,

    We krijgen veel meldingen uit Lier en omgeving. Het gaat om twee verschillende polissen, dus twee dossiers, maar u hoeft alleen ons de gegevens te bezorgen.

    Auto: uw Comfort Auto met Mini Omnium Extra dekt natuurkrachten, uitdrukkelijk ook hagel (artikel 1.4.3 van "Bescherming van het voertuig"). Een expert komt de deukjes bekijken; hageldeuken worden vaak zonder overspuiten hersteld (uitdeuken).

    Woning: uw Comfort Thuis Flex dekt storm, hagel, sneeuw- en ijsdruk (artikel 3.14 A van de basisdekkingen). De veranda en de dakgoot vallen daaronder. Hagelschade is gedekt ongeacht de windsnelheid; de grens van 80 km/u geldt alleen voor storm.

    Uw tuinset is helaas niet gedekt: artikel 3.14 A sluit schade uit aan voorwerpen die zich buiten bevinden en niet blijvend vastgemaakt zijn.

    Stuur me foto's van de auto, de veranda en de dakgoot. Als de veranda nu lekt, mag u een voorlopige afdekking laten plaatsen; bewaar de factuur, die kosten worden mee vergoed.

    Met vriendelijke groeten,

    Pieter Janssens
    Schadebeheer - Verzekeringskantoor Hoflandt

- id: hoflandt.hagel-dubois.3
  date: 2026-07-06 20:15
  from: nathalie.dubois@telenet.be
  to: pieter.janssens@hoflandt.be
  subject: "RE: Hagelschade auto en veranda"
  body: |
    Dag Pieter,

    Bedankt voor de snelle reactie. Foto's zitten in de bijlage. De veranda lekt gelukkig niet. Jammer van de tuinset, maar begrijpelijk.

    Een verandabouwer heeft al een offerte gemaakt om de drie platen en de goot te vervangen: 2.460 euro incl. btw. Moet ik wachten op een expert of mag ik die al laten uitvoeren?

    Nathalie

- id: hoflandt.hagel-dubois.4
  date: 2026-07-08 11:30
  from: pieter.janssens@hoflandt.be
  to: nathalie.dubois@telenet.be
  subject: "RE: Hagelschade auto en veranda (dossiers S-2026-0431 en S-2026-0432)"
  body: |
    Dag Nathalie,

    Voor de woning heeft AXA de offerte van 2.460 EUR aanvaard zonder expertise. U mag de verandabouwer laten starten; de vergoeding min de vrijstelling uit uw bijzondere voorwaarden wordt gestort na ontvangst van de factuur.

    Voor de auto organiseert AXA een hagelstraat in Mechelen: op 15 juli om 14u kan u er terecht voor de schatting. Ik stuur u de bevestiging apart door.

    Groeten,
    Pieter

# --- Dirk Jacobs: betwiste aansprakelijkheid op kruispunt (rechtsbijstand) --------------------
- id: hoflandt.rechtsbijstand-jacobs.1
  date: 2026-07-28 21:05
  from: dirk.jacobs@skynet.be
  to: schade@hoflandt.be
  subject: Tegenpartij beweert dat ik door rood reed
  body: |
    Goedenavond,

    Op 9 juli had ik een aanrijding op het kruispunt van de Provinciesteenweg en de Heidestraat in Boechout. Ik reed door op groen, de andere bestuurder kwam van rechts en reed tegen mijn flank. Nu schrijft zijn verzekeraar dat ik door het rode licht reed en dat ze niets betalen. Er was een getuige, een fietser die op het fietspad stond te wachten, en ik heb zijn gegevens.

    Mijn schade is ongeveer 4.200 euro. Ik ben niet van plan dit te laten passeren. Wat zijn mijn mogelijkheden?

    Dirk Jacobs

- id: hoflandt.rechtsbijstand-jacobs.2
  date: 2026-07-29 10:18
  from: pieter.janssens@hoflandt.be
  to: dirk.jacobs@skynet.be
  subject: "RE: Tegenpartij beweert dat ik door rood reed"
  attachments: [axa_rechtsbijstand_auto]
  body: |
    Dag meneer Jacobs,

    Gelukkig heeft u bij uw Comfort Auto de waarborg Rechtsbijstand Full. Die wordt beheerd door Legal Village, de rechtsbijstandsmaatschappij van AXA. Die komt precies voor dit soort situaties tussen: uw schade verhalen op een tegenpartij die aansprakelijk is.

    De belangrijkste punten uit de voorwaarden (in bijlage):
    - Legal Village probeert eerst minnelijk te regelen met de verzekeraar van de tegenpartij, met de verklaring van uw getuige.
    - Lukt dat niet en is een gerechtelijke procedure nodig, dan heeft u de vrije keuze van advocaat (artikel 1.1.2).
    - De kosten van advocaat, gerechtsdeskundige, gerechtsdeurwaarder en procedure worden gedragen tot 125.000 EUR per schadegeval.
    - Is de aansprakelijke tegenpartij onvermogend, dan voorziet de waarborg ook een tussenkomst (tot 20.000 EUR).

    Kan u mij de brief van de tegenpartij, het aanrijdingsformulier of PV, foto's en de gegevens van de getuige bezorgen? Dan open ik het dossier bij Legal Village.

    Met vriendelijke groeten,

    Pieter Janssens
    Schadebeheer - Verzekeringskantoor Hoflandt

- id: hoflandt.rechtsbijstand-jacobs.3
  date: 2026-07-30 08:40
  from: dirk.jacobs@skynet.be
  to: pieter.janssens@hoflandt.be
  subject: "RE: Tegenpartij beweert dat ik door rood reed"
  body: |
    Dag Pieter,

    Alle documenten zitten in bijlage. Nog een vraag: mijn schoonbroer is advocaat in Mechelen en heeft ervaring met verkeerszaken. Kan ik hem kiezen als het tot een procedure komt, of moet ik een advocaat van de verzekering nemen?

    Dirk

- id: hoflandt.rechtsbijstand-jacobs.4
  date: 2026-07-30 11:55
  from: pieter.janssens@hoflandt.be
  to: dirk.jacobs@skynet.be
  subject: "RE: Tegenpartij beweert dat ik door rood reed (dossier S-2026-0470)"
  body: |
    Dag Dirk,

    U mag uw schoonbroer kiezen. Artikel 1.1.2 garandeert de vrije keuze van advocaat zodra een gerechtelijke of administratieve procedure nodig is (of bij een belangenconflict). Een paar aandachtspunten:
    - de kosten van één advocaat worden gedragen; verandert u zelf van advocaat, dan betaalt u de extra kosten;
    - u of uw advocaat houdt Legal Village op de hoogte van het verloop van het dossier (artikel 1.1.2.6);
    - hij mag de afrekening van zijn kosten en erelonen rechtstreeks aan Legal Village bezorgen.

    Ik heb het dossier vandaag geopend. Legal Village contacteert eerst de verzekeraar van de tegenpartij met de getuigenverklaring. Ik hou u op de hoogte.

    Groeten,
    Pieter

# --- Ines Goossens: met de auto naar Frankrijk, pech in Rennes (wegenhulp buitenland) ------
- id: hoflandt.frankrijk-goossens.1
  date: 2026-07-10 12:33
  from: ines.goossens@gmail.com
  to: els@hoflandt.be
  subject: Op vakantie naar Bretagne met auto en caravan
  body: |
    Dag Els,

    Op 18 juli vertrekken we met de auto en onze caravan naar Bretagne, drie weken. Moet ik iets regelen voor de verzekering? Heb ik een groene kaart nodig? En wat als we onderweg pech hebben, ook met de caravan?

    Groetjes,
    Ines

- id: hoflandt.frankrijk-goossens.2
  date: 2026-07-10 15:02
  from: els@hoflandt.be
  to: ines.goossens@gmail.com
  subject: "RE: Op vakantie naar Bretagne met auto en caravan"
  attachments: [axa_wegenhulp]
  body: |
    Dag Ines,

    Je hoeft niets extra te regelen. De vroegere groene kaart heet nu het internationaal verzekeringsbewijs en je hebt dat van AXA gekregen. Leg het in de auto; je Aansprakelijkheid is geldig in Frankrijk.

    Je hebt ook de waarborg Wegenhulp (voorwaarden in bijlage). In het buitenland dekt die onder andere:
    - pechverhelping ter plaatse of sleping naar de dichtstbijzijnde garage (artikel 2.2.1);
    - opsturen van onderdelen die ter plaatse niet beschikbaar zijn (2.2.2);
    - een vervangwagen om je reis verder te zetten, of de terugkeer of voortzetting van de reis en/of hotelkosten (2.2.3 en 2.2.4);
    - het ophalen of repatriëren van je wagen als die niet binnen redelijke tijd hersteld kan worden (2.2.7).

    Je caravan is mee gedekt, als die maximaal 3,5 ton weegt en inclusief dissel niet langer is dan 8 meter (artikel 1.1).

    Belangrijk: bel bij pech altijd eerst de bijstandscentrale vóór je zelf iets regelt, anders betaalt AXA enkel wat het hen zelf gekost zou hebben.

    Fijne vakantie!
    Els Hoflandt
    Verzekeringskantoor Hoflandt

- id: hoflandt.frankrijk-goossens.3
  date: 2026-07-24 18:50
  from: ines.goossens@gmail.com
  to: [els@hoflandt.be, schade@hoflandt.be]
  subject: "RE: Op vakantie naar Bretagne met auto en caravan - pech in Rennes"
  body: |
    Hallo,

    Toch pech: vlak voor Rennes begaf de koppeling het. We hebben de bijstandscentrale gebeld zoals je zei. Ze hebben de auto naar een garage in Rennes gesleept en de caravan naar een camping in de buurt. Maar de garage moet het onderdeel bestellen, dat duurt minstens 5 dagen. We zitten nu met twee kinderen in een hotel.

    Worden het hotel en de huurauto betaald? De bijstandscentrale sprak over een vervangwagen maar kon ons niet zeggen voor hoelang.

    Ines

- id: hoflandt.frankrijk-goossens.4
  date: 2026-07-25 09:12
  from: pieter.janssens@hoflandt.be
  to: ines.goossens@gmail.com
  cc: els@hoflandt.be
  subject: "RE: Op vakantie naar Bretagne met auto en caravan - pech in Rennes"
  body: |
    Dag Ines,

    Goed dat jullie eerst gebeld hebben, dat maakt alles eenvoudiger. Volgens de voorwaarden Wegenhulp kiest u in het buitenland tussen:
    - een vervangwagen (categorie B) om jullie eindbestemming te bereiken en ter plaatse mobiel te blijven, gedurende 7 opeenvolgende dagen (artikel 2.2.3.2); of
    - de terugkeer of voortzetting van de reis en/of hotelkosten zolang de wagen geïmmobiliseerd is (artikel 2.2.4).

    Met de caravan is een vervangwagen met trekhaak waarschijnlijk de beste keuze. Ik heb dat al aan de bijstandscentrale doorgegeven. Hou alle bonnetjes van het hotel bij.

    Is de wagen na jullie vakantie nog niet klaar, dan organiseert AXA het ophalen van de auto (artikel 2.2.7).

    Veel sterkte, en toch nog een fijne vakantie!
    Pieter Janssens
    Schadebeheer - Verzekeringskantoor Hoflandt

# --- Wim Mertens: diesel in benzinewagen (verkeerde brandstof) --------------------------------
- id: hoflandt.brandstof-mertens.1
  date: 2026-09-15 08:20
  from: wim.mertens@telenet.be
  to: schade@hoflandt.be
  subject: Verkeerde brandstof getankt
  body: |
    Dag,

    Stom, stom, stom: ik heb gisteren diesel getankt in mijn benzinewagen (Ford Puma). Ik heb het pas gemerkt na een kilometer of 20 toen de motor begon te sputteren. Hij staat nu bij de garage. Wordt dit gedekt door mijn omnium?

    Wim Mertens

- id: hoflandt.brandstof-mertens.2
  date: 2026-09-15 11:05
  from: pieter.janssens@hoflandt.be
  to: wim.mertens@telenet.be
  subject: "RE: Verkeerde brandstof getankt"
  attachments: [axa_omnium]
  body: |
    Dag meneer Mertens,

    Het gebeurt vaker dan u denkt. Uw Omnium dekt dit: artikel 1.4.6 (Materiële schade) vermeldt uitdrukkelijk de schade door slechte kwaliteit van brandstof of de verkeerde brandstof. Dat omvat het leegmaken en spoelen van de tank en de brandstofleidingen en de schade aan de motor die daardoor ontstaan is.

    Van de vergoeding gaat uw vrijstelling af (250 EUR). Let op: een schadegeval "Materiële schade" waarbij u zelf in fout bent, kan de premie van die dekking op de volgende vervaldag verhogen (algemene bepalingen, artikel 2.1.2). Bezorg me de offerte van de garage, dan bekijken we of een aangifte de moeite loont.

    Met vriendelijke groeten,

    Pieter Janssens
    Schadebeheer - Verzekeringskantoor Hoflandt

- id: hoflandt.brandstof-mertens.3
  date: 2026-09-16 17:32
  from: wim.mertens@telenet.be
  to: pieter.janssens@hoflandt.be
  subject: "RE: Verkeerde brandstof getankt"
  body: |
    Dag Pieter,

    De garage heeft de tank leeggemaakt en gespoeld, maar de hogedrukpomp moet ook vervangen worden. Totaal 1.650 euro. Wat raad je aan? Indienen of niet?

    Wim

- id: hoflandt.brandstof-mertens.4
  date: 2026-09-17 09:45
  from: pieter.janssens@hoflandt.be
  to: wim.mertens@telenet.be
  subject: "RE: Verkeerde brandstof getankt"
  body: |
    Dag Wim,

    Ik heb het voor je uitgerekend. AXA zou 1.400 EUR betalen (1.650 EUR min 250 EUR vrijstelling). Je premie voor de dekking Materiële schade is nu 412 EUR per jaar. Na een schadegeval in fout gaat die naar 130% en zakt ze daarna elk schadevrij jaar (125%, 120%, 115%, 110%) tot ze na vijf schadevrije jaren weer op 100% staat. Over die vijf jaar kost dat in totaal ongeveer 412 EUR extra.

    Aangifte doen loont dus nog altijd (1.400 EUR ontvangen tegenover ongeveer 412 EUR extra premie). Ik heb het dossier ingediend, nummer S-2026-0532. AXA stuurt wellicht geen expert voor dit bedrag.

    Groeten,
    Pieter

# --- Kathleen Hermans: auto vervangen door tweedehands (16 dagen, offerte) ------------------
- id: hoflandt.nieuwe-auto-hermans.1
  date: 2026-09-08 19:47
  from: kathleen.hermans@hotmail.com
  to: els@hoflandt.be
  subject: Nieuwe (tweedehands) auto - wat moet ik doen?
  body: |
    Dag Els,

    Ik verkoop mijn oude Citroën C3 en heb een tweedehands Škoda Octavia Combi gekocht (eerste inschrijving maart 2022, 41.000 km). Ik haal hem op 22 september op bij de garage. Mag ik mijn nummerplaat gewoon overzetten? Ben ik vanaf dan verzekerd?

    Ik zou nu ook graag een omnium nemen, want het is een duurdere auto. Kan je een offerte maken? De aankoopprijs is 21.900 euro.

    Kathleen

- id: hoflandt.nieuwe-auto-hermans.2
  date: 2026-09-09 11:20
  from: els@hoflandt.be
  to: kathleen.hermans@hotmail.com
  subject: "RE: Nieuwe (tweedehands) auto - wat moet ik doen?"
  body: |
    Dag Kathleen,

    Proficiat met je nieuwe auto! Je mag je nummerplaat meenemen naar de Octavia. Laat hem inschrijven via de garage (DIV) met je bestaande plaat.

    Dekking: bij vervanging van je wagen blijft je Aansprakelijkheid nog 16 dagen gelden voor je nieuwe wagen met dezelfde nummerplaat. Maar laat die termijn niet verlopen: wordt de vervanging niet binnen 16 dagen gemeld, dan wordt je contract vanaf de 17e dag geschorst. Stuur me dus de gegevens van de Octavia (chassisnummer, datum eerste inschrijving, vermogen en de aankoopfactuur), dan pas ik je polis aan vanaf 22 september.

    Offerte omnium op basis van de factuurwaarde 21.900 EUR (jaarpremie, alle taksen inbegrepen):
    - Mini Omnium Extra (brand, glas, dieren, natuurkrachten, diefstal, materiële schade enkel bij totaal verlies): 318 EUR
    - Omnium met vrijstelling 250 EUR: 596 EUR
    - Omnium met vrijstelling 500 EUR: 512 EUR
    bovenop je huidige premie Aansprakelijkheid van 486 EUR.

    Voor een wagen van 4,5 jaar oud raad ik de Omnium met 500 EUR vrijstelling aan.

    Groetjes,
    Els Hoflandt
    Verzekeringskantoor Hoflandt

- id: hoflandt.nieuwe-auto-hermans.3
  date: 2026-09-09 20:15
  from: kathleen.hermans@hotmail.com
  to: els@hoflandt.be
  subject: "RE: Nieuwe (tweedehands) auto - wat moet ik doen?"
  body: |
    Dag Els,

    Ik ga voor de Omnium met 500 euro vrijstelling. De aankoopfactuur en het gelijkvormigheidsattest zitten in bijlage. Chassisnummer TMBJR7NX5NY041236, 110 kW.

    Kan je ook bevestigen dat ik vanaf 22/9 in orde ben? De garage vraagt een verzekeringsbewijs.

    Kathleen
