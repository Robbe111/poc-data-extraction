<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Verzekeringen prototype</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    h1 { font-size: 1.4rem; }
    h2 { font-size: 1.1rem; margin-top: 2rem; }
    .email { border: 1px solid #ddd; border-radius: 6px; padding: 0.75rem 1rem; margin-bottom: 0.75rem; }
    .email .meta { font-size: 0.85rem; color: #666; margin-bottom: 0.4rem; overflow-wrap: anywhere; }
    .email .subject { font-weight: 600; }
    .email .body { white-space: pre-wrap; font-size: 0.9rem; margin-top: 0.5rem; max-height: 14rem; overflow: auto; }
    .badge { display: inline-block; font-size: 0.75rem; padding: 0.05rem 0.4rem; border-radius: 4px; background: #eef; color: #335; margin-right: 0.3rem; }
    .badge.pdf { background: #fde8e8; color: #822; }
    .badge.locate { background: #fff3b0; color: #640; }
    a.badge { text-decoration: none; }
    a.badge:hover { text-decoration: underline; }
    .distance { font-size: 0.8rem; color: #999; }
    input[type="text"] { width: 60%; padding: 0.5rem; }
    select, button { padding: 0.5rem 1rem; }
    .pager { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.75rem; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Verzekeringen prototype</h1>

  <h2>Semantic search (vector DB)</h2>
  <form id="search-form">
    <input type="text" id="query" placeholder="e.g. power prices in California" />
    <select id="source-type">
      <option value="">Emails + PDFs</option>
      <option value="email">Emails only</option>
      <option value="pdf">PDFs only</option>
    </select>
    <button type="submit">Search</button>
  </form>
  <div id="search-results"></div>

  <h2>All emails (normal DB)</h2>
  <div class="pager">
    <button id="prev">&larr;</button>
    <span id="page-info"></span>
    <button id="next">&rarr;</button>
  </div>
  <div id="email-list">Loading...</div>

  <script>
    const PAGE_SIZE = 50;
    let offset = 0;

    const escapeHtml = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const attachmentUrl = (id) => `/api/attachments/${encodeURIComponent(id)}`;

    async function loadEmails() {
      const res = await fetch(`/api/emails?limit=${PAGE_SIZE}&offset=${offset}`);
      const { total, emails } = await res.json();
      const container = document.getElementById('email-list');
      container.innerHTML = '';
      document.getElementById('page-info').textContent =
        total ? `${offset + 1}–${Math.min(offset + PAGE_SIZE, total)} of ${total}` : '';
      document.getElementById('prev').disabled = offset === 0;
      document.getElementById('next').disabled = offset + PAGE_SIZE >= total;
      if (emails.length === 0) {
        container.textContent = 'No emails yet — run python backend/ingest_enron.py';
        return;
      }
      emails.forEach(e => container.appendChild(renderCard({
        sender: e.sender, recipients: e.recipients, subject: e.subject, date: e.date, body: e.body,
        badges: e.attachments.map(a => ({ label: a.filename, cls: a.extension, href: attachmentUrl(a.id) })),
      })));
    }

    function renderBadge(b) {
      return b.href
        ? `<a class="badge ${escapeHtml(b.cls)}" href="${escapeHtml(b.href)}" target="_blank" title="Open original">${escapeHtml(b.label)} ↗</a>`
        : `<span class="badge ${escapeHtml(b.cls)}">${escapeHtml(b.label)}</span>`;
    }

    function renderCard({ sender, recipients, subject, date, body, badges = [], distance }) {
      const div = document.createElement('div');
      div.className = 'email';
      div.innerHTML = `
        <div class="meta">From: ${escapeHtml(sender)} · To: ${escapeHtml(recipients.slice(0, 200))}${recipients.length > 200 ? '…' : ''}
          — ${date ? new Date(date).toLocaleString() : ''}
          ${distance !== undefined ? `<span class="distance"> · distance: ${distance.toFixed(3)}</span>` : ''}</div>
        <div class="subject">${escapeHtml(subject)}</div>
        <div>${badges.map(renderBadge).join('')}</div>
        <div class="body">${escapeHtml(body)}</div>
      `;
      return div;
    }

    document.getElementById('prev').addEventListener('click', () => { offset = Math.max(0, offset - PAGE_SIZE); loadEmails(); });
    document.getElementById('next').addEventListener('click', () => { offset += PAGE_SIZE; loadEmails(); });

    document.getElementById('search-form').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const query = document.getElementById('query').value.trim();
      if (!query) return;
      const source_type = document.getElementById('source-type').value || null;
      const res = await fetch('/api/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, source_type }),
      });
      const results = await res.json();
      const container = document.getElementById('search-results');
      container.innerHTML = results.length ? '' : 'No results.';
      results.forEach(r => {
        const m = r.metadata;
        const badges = m.source_type === 'email'
          ? [{ label: 'email body', cls: 'email' }]
          : [{ label: `${m.source_type.toUpperCase()}: ${m.attachment_name}`, cls: m.source_type,
               href: m.attachment_id ? attachmentUrl(m.attachment_id) : null }];
        // Email chunks carry the subject as a prefix (see vector_store.py); it isn't part of the body text.
        const passage = m.source_type === 'email' ? r.document.slice(m.subject.length).trim() : r.document;
        const target = m.attachment_id ? `attachment=${encodeURIComponent(m.attachment_id)}` : `email=${encodeURIComponent(m.email_id)}`;
        badges.push({ label: 'show in document', cls: 'locate', href: `viewer.html?${target}&q=${encodeURIComponent(passage || m.subject)}` });
        container.appendChild(renderCard({
          sender: m.sender, recipients: m.recipients, subject: m.subject, date: m.date,
          body: r.document, badges, distance: r.distance,
        }));
      });
    });

    loadEmails();
  </script>
</body>
</html>
